<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarpunk Space - Web Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #4cd7b1;
        }

        #gameContainer {
            text-align: center;
        }

        canvas {
            border: 2px solid #4cd7b1;
            background: #0a0a14;
            box-shadow: 0 0 20px rgba(76, 215, 177, 0.3);
        }

        #score {
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 0 0 10px #4cd7b1;
        }

        #instructions {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.7;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>SOLARPUNK SPACE</h1>
        <div id="score">Solar Energy: 0</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            Arrow Keys / WASD to move • Collect golden orbs • Avoid red debris
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let gameOver = false;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 30,
            height: 30,
            speed: 5
        };

        // Arrays for game objects
        const stars = [];
        const solarOrbs = [];
        const debris = [];

        // Input
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Initialize stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        // Spawn objects
        function spawnSolarOrb() {
            if (Math.random() < 0.02 && !gameOver) {
                solarOrbs.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -20,
                    radius: 12,
                    speed: 2
                });
            }
        }

        function spawnDebris() {
            if (Math.random() < 0.015 && !gameOver) {
                debris.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -20,
                    size: 20,
                    speed: Math.random() * 2 + 1.5,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.1
                });
            }
        }

        // Draw functions
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Solar sail
            ctx.fillStyle = '#4cd7b1';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-10, 0);
            ctx.lineTo(10, 0);
            ctx.fill();

            // Ship body
            ctx.fillStyle = '#2a7868';
            ctx.fillRect(-8, 0, 16, 15);

            // Energy core
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
        }

        function drawSolarOrbs() {
            solarOrbs.forEach(orb => {
                // Outer glow
                const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.5, '#ffd700');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0.2)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawDebris() {
            debris.forEach(deb => {
                ctx.save();
                ctx.translate(deb.x, deb.y);
                ctx.rotate(deb.rotation);

                ctx.fillStyle = '#ff6464';
                ctx.strokeStyle = '#964646';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(-10, -8);
                ctx.lineTo(5, -12);
                ctx.lineTo(12, 2);
                ctx.lineTo(3, 10);
                ctx.lineTo(-8, 6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });
        }

        // Update functions
        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

            // Keep on screen
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
        }

        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function updateSolarOrbs() {
            for (let i = solarOrbs.length - 1; i >= 0; i--) {
                solarOrbs[i].y += solarOrbs[i].speed;

                // Check collision with player
                const dx = solarOrbs[i].x - player.x;
                const dy = solarOrbs[i].y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < solarOrbs[i].radius + 15) {
                    score += 10;
                    document.getElementById('score').textContent = `Solar Energy: ${score}`;
                    solarOrbs.splice(i, 1);
                } else if (solarOrbs[i].y > canvas.height + 20) {
                    solarOrbs.splice(i, 1);
                }
            }
        }

        function updateDebris() {
            for (let i = debris.length - 1; i >= 0; i--) {
                debris[i].y += debris[i].speed;
                debris[i].rotation += debris[i].rotSpeed;

                // Check collision with player
                const dx = debris[i].x - player.x;
                const dy = debris[i].y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < debris[i].size + 15 && !gameOver) {
                    gameOver = true;
                    showGameOver();
                } else if (debris[i].y > canvas.height + 20) {
                    debris.splice(i, 1);
                }
            }
        }

        function showGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffd700';
            ctx.font = '48px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('SHIP DAMAGED!', canvas.width / 2, canvas.height / 2);

            ctx.fillStyle = '#4cd7b1';
            ctx.font = '24px Courier New';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 90);
        }

        // Restart
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'r' || e.key === 'R') && gameOver) {
                score = 0;
                gameOver = false;
                solarOrbs.length = 0;
                debris.length = 0;
                player.x = canvas.width / 2;
                player.y = canvas.height - 100;
                document.getElementById('score').textContent = `Solar Energy: 0`;
            }
        });

        // Game loop
        function gameLoop() {
            // Clear
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update
            if (!gameOver) {
                updatePlayer();
                updateStars();
                updateSolarOrbs();
                updateDebris();
                spawnSolarOrb();
                spawnDebris();
            }

            // Draw
            drawStars();
            drawSolarOrbs();
            drawDebris();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
