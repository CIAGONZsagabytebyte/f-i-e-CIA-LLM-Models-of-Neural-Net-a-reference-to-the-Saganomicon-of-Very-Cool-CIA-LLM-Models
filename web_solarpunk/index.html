<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarpunk Space - Web Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0520 0%, #1a1040 100%);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #64ff96;
        }

        #gameContainer {
            position: relative;
            margin: 20px;
        }

        canvas {
            border: 2px solid #64ff96;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(100, 255, 150, 0.3);
            background: #0a0520;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #64ff96;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(100, 255, 150, 0.5);
            pointer-events: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff6464;
            text-align: center;
            display: none;
        }

        #gameOver.visible {
            display: block;
        }

        #gameOver h1 {
            color: #ff6464;
            margin-bottom: 15px;
            font-size: 36px;
        }

        #gameOver p {
            margin: 10px 0;
            font-size: 20px;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #64ff96;
            color: #0a0520;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        #restartBtn:hover {
            background: #50dd82;
            transform: scale(1.05);
        }

        .info {
            margin-top: 20px;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

        .info h2 {
            color: #64ff96;
            margin-bottom: 10px;
        }

        .info p {
            color: #9999cc;
            line-height: 1.6;
        }

        .controls {
            margin-top: 15px;
            color: #ffdc64;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
        </div>
        <div id="gameOver">
            <h1>MISSION FAILED</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">RESTART MISSION</button>
        </div>
    </div>

    <div class="info">
        <h2>🌱 Solarpunk Space Prototype 🚀</h2>
        <p>Navigate your solar-powered ship through the cosmos. Collect golden energy orbs and avoid space debris!</p>
        <div class="controls">
            <strong>Controls:</strong> Arrow Keys or WASD to move | Space to restart after game over
        </div>
    </div>

    <script>
        // Game configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        // Game state
        let gameState = 'playing'; // 'playing' or 'gameover'
        let score = 0;
        let frameCount = 0;

        // Player ship
        const player = {
            x: 100,
            y: canvas.height / 2,
            width: 40,
            height: 30,
            speed: 4,
            color: '#64ff96',
            trail: []
        };

        // Game objects
        let orbs = [];
        let debris = [];
        let stars = [];
        let particles = [];

        // Input handling
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Initialize game
        function init() {
            gameState = 'playing';
            score = 0;
            frameCount = 0;
            player.x = 100;
            player.y = canvas.height / 2;
            player.trail = [];

            // Create background stars
            stars = [];
            for (let layer = 0; layer < 3; layer++) {
                for (let i = 0; i < 50; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: layer + 1,
                        speed: (layer + 1) * 0.5,
                        brightness: 150 + Math.random() * 105
                    });
                }
            }

            // Create initial orbs
            orbs = [];
            spawnOrbs(5);

            // Create initial debris
            debris = [];
            spawnDebris(3);

            particles = [];
            gameOverElement.classList.remove('visible');
        }

        // Spawn solar orbs
        function spawnOrbs(count) {
            for (let i = 0; i < count; i++) {
                orbs.push({
                    x: canvas.width / 2 + Math.random() * (canvas.width / 2 - 50),
                    y: 50 + Math.random() * (canvas.height - 100),
                    radius: 12,
                    glowRadius: 12,
                    angle: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.1
                });
            }
        }

        // Spawn debris
        function spawnDebris(count) {
            for (let i = 0; i < count; i++) {
                debris.push({
                    x: canvas.width + 200 * Math.random(),
                    y: 50 + Math.random() * (canvas.height - 100),
                    size: 15 + Math.random() * 15,
                    speed: 1 + Math.random() * 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: -2 + Math.random() * 4
                });
            }
        }

        // Create particle effect
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: color
                });
            }
        }

        // Update game state
        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            // Update player
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

            // Boundary checking
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
            player.y = Math.max(0, Math.min(player.y, canvas.height - player.height));

            // Update trail
            player.trail.push({ x: player.x + player.width / 2, y: player.y + player.height / 2 });
            if (player.trail.length > 20) player.trail.shift();

            // Update stars
            stars.forEach(star => {
                star.x -= star.speed;
                if (star.x < 0) {
                    star.x = canvas.width;
                    star.y = Math.random() * canvas.height;
                }
            });

            // Update orbs
            orbs.forEach(orb => {
                orb.glowRadius = orb.radius + 5 * Math.abs(Math.sin(orb.angle));
                orb.angle += orb.pulseSpeed;
            });

            // Update debris
            debris.forEach((d, index) => {
                d.x -= d.speed;
                d.rotation += d.rotationSpeed;

                if (d.x < -d.size * 2) {
                    debris.splice(index, 1);
                }
            });

            // Update particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            // Check collisions
            checkCollisions();

            // Spawn new objects
            if (frameCount % 120 === 0 && orbs.length < 8) {
                spawnOrbs(1);
            }
            if (frameCount % 90 === 0) {
                spawnDebris(1);
            }
        }

        // Collision detection
        function checkCollisions() {
            const playerRect = {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height
            };

            // Check orb collection
            orbs.forEach((orb, index) => {
                const dx = (player.x + player.width / 2) - orb.x;
                const dy = (player.y + player.height / 2) - orb.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < orb.radius + player.width / 2) {
                    orbs.splice(index, 1);
                    score += 10;
                    scoreElement.textContent = score;
                    createParticles(orb.x, orb.y, '#ffdc64', 15);
                }
            });

            // Check debris collision
            debris.forEach(d => {
                const dx = (player.x + player.width / 2) - d.x;
                const dy = (player.y + player.height / 2) - d.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < d.size + player.width / 2) {
                    gameOver();
                }
            });
        }

        // Game over
        function gameOver() {
            gameState = 'gameover';
            createParticles(player.x, player.y, '#ff6432', 30);
            finalScoreElement.textContent = score;
            gameOverElement.classList.add('visible');
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0520';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            stars.forEach(star => {
                const brightness = Math.floor(star.brightness);
                ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw orbs
            orbs.forEach(orb => {
                // Glow effect
                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = `rgba(255, 220, 100, ${0.3 - i * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, orb.glowRadius + i * 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Core
                ctx.fillStyle = '#ffdc64';
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffc8';
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius - 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw debris
            debris.forEach(d => {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rotation * Math.PI / 180);

                ctx.fillStyle = '#966450';
                ctx.strokeStyle = '#644632';
                ctx.lineWidth = 2;

                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const variance = 0.7 + Math.random() * 0.6;
                    const x = Math.cos(angle) * d.size * variance;
                    const y = Math.sin(angle) * d.size * variance;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });

            // Draw particles
            particles.forEach(p => {
                const size = Math.floor(4 * p.life);
                if (size > 0) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw player
            if (gameState === 'playing') {
                // Trail
                player.trail.forEach((pos, index) => {
                    const alpha = index / player.trail.length;
                    const size = Math.floor(3 * alpha);
                    ctx.fillStyle = `rgba(100, 255, 150, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Ship
                ctx.fillStyle = player.color;
                ctx.strokeStyle = '#32c864';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(player.x + player.width, player.y + player.height / 2);
                ctx.lineTo(player.x, player.y);
                ctx.lineTo(player.x, player.y + player.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Restart button
        restartBtn.addEventListener('click', init);
        document.addEventListener('keydown', e => {
            if (e.key === ' ' && gameState === 'gameover') {
                init();
            }
        });

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
